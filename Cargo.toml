[workspace]
resolver = "3"
members = ["engine", "engine/ffi", "chat", "server/shared", "server/den", "server/hop"]

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/impsland/imp"
homepage = "https://github.com/impsland/imp"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The core for a local Apple build (make build, make test, make ios): quick to rebuild.
[profile.apple-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
altcha = "1.1.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap"] }
hex = "0.4.3"
if-addrs = "0.15.0"
hmac = "0.13.0"
mimalloc = { version = "0.1.52", default-features = false }
moka = { version = "0.12.16", default-features = false, features = ["sync"] }
rand = "0.10.3"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom", "std"] }
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "process"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
imp-shared = { path = "server/shared", version = "2.1.0" }
imp-engine = { path = "engine", version = "2.1.0" }
imp-den = { path = "server/den", version = "2.1.0" }
imp-hop = { path = "server/hop", version = "2.1.0" }
uniffi = { version = "0.32.2", features = ["cli"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help", "env"] }
toml = "1.1.8"
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls", "json"] }
keyring = "4.2.0"
qrcode = { version = "0.14.1", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
textwrap = "0.16.4"
pulldown-cmark = { version = "0.13.6", default-features = false }
uuid = { version = "1.29.0", default-features = false, features = ["serde"] }
