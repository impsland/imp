name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcrun swift --version
      - name: Build
        run: make build
      - name: Test
        run: make test
      # A test that stops the process leaves only "unexpected signal" in the log, and the runners keep
      # no crash reports: run the tests again under lldb and print where it stopped.
      - name: Backtrace
        if: failure()
        run: |
          bundle="$(find .build -maxdepth 4 -type d -path '*debug/*PackageTests.xctest' | head -1)"
          [[ -n "$bundle" ]] || bundle="$(find .build -maxdepth 4 -type d -path '*debug/*Tests.xctest' | head -1)"
          binary="$bundle/Contents/MacOS/$(basename "$bundle" .xctest)"
          helper="$(dirname "$(xcrun --find swift)")/../libexec/swift/pm/swiftpm-testing-helper"
          platform="$(xcrun --show-sdk-platform-path)/Developer"
          lldb --batch \
            -o "env DYLD_FRAMEWORK_PATH=$platform/Library/Frameworks" \
            -o "env DYLD_LIBRARY_PATH=$platform/usr/lib" \
            -o run -k "thread backtrace -c 40" -k "quit 1" \
            -- "$helper" --test-bundle-path "$binary" "$binary" --testing-library swift-testing \
            2>&1 | grep -vE "^(◇|✔|➜|􀟈|􁁛|􀄵)" | tail -80

  iphone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Imp for iPhone (Simulator)
        run: |
          xcodebuild -project iOS/ImpPhone.xcodeproj -scheme ImpPhone -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO -quiet build
