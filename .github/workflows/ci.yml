name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcrun swift --version
      - name: Build
        run: make build
      - name: Test
        run: make test
      # A test that stops the process leaves only "unexpected signal" in the log: keep the crash reports.
      - name: Crash reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-reports
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 7

  iphone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Imp for iPhone (Simulator)
        run: |
          xcodebuild -project iOS/ImpPhone.xcodeproj -scheme ImpPhone -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO -quiet build
