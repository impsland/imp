name: Release

# Push a version tag (git tag v1.2.3 && git push origin v1.2.3) to publish Imp.zip on GitHub
# Releases and update the Homebrew cask in impsland/homebrew-tap (HOMEBREW_TAP_TOKEN may push there).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      # Releases are signed with the same self-signed certificate every time, so macOS sees each
      # update as the same app: Keychain access and Microphone permission carry over.
      - name: Signing identity
        env:
          P12: ${{ secrets.IMP_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.IMP_SIGNING_PASSWORD }}
        run: |
          [[ -n "$P12" && -n "$P12_PASSWORD" ]] || { echo "::error::IMP_SIGNING_P12 and IMP_SIGNING_PASSWORD secrets are required"; exit 1; }
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/imp.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/imp.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/imp.p12"
          echo "IMP_SIGN_IDENTITY=Imp Release Signing" >> "$GITHUB_ENV"

      - name: Build
        run: make dist VERSION="$VERSION"

      - name: Remove signing identity
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Imp.zip \
            --title "Imp $VERSION" --generate-notes --verify-tag

      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: impsland/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        run: |
          scripts/cask.sh "$VERSION" "$(shasum -a 256 build/Imp.zip | cut -d' ' -f1)" > tap/Casks/imp.rb
          cd tap
          git add Casks/imp.rb
          git diff --cached --quiet && exit 0
          # Credited to the maintainer (GitHub's no-reply address for arthuqa).
          git config user.name "Art"
          git config user.email "157759405+arthuqa@users.noreply.github.com"
          git commit -m "imp $VERSION"
          git push
