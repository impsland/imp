<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:#0b1024}
  .sky{position:fixed;inset:0;background:
    radial-gradient(120% 90% at 78% 18%, rgba(93,120,214,.35), transparent 60%),
    radial-gradient(100% 80% at 15% 85%, rgba(148,84,180,.22), transparent 62%),
    linear-gradient(180deg,#070a1c 0%,#101936 46%,#1b2350 100%);}
  .stars,.twinkle,.shoot{position:absolute;inset:0}
  .stars{background-repeat:repeat;background-size:340px 340px;opacity:.85}
  .shooting{position:absolute;top:-10%;left:-30%;width:220px;height:2px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
    filter:drop-shadow(0 0 6px rgba(255,255,255,.8));opacity:0;
    transform:rotate(-18deg)}
  .orb{position:absolute;border-radius:50%;filter:blur(2px)}
  .moon{right:12%;top:14%;width:78px;height:78px;
    background:radial-gradient(circle at 35% 32%,#fffdf2,#e9e6c8 62%,#c8c39a);
    box-shadow:0 0 26px 10px rgba(255,246,200,.28),0 0 80px 30px rgba(255,240,190,.10),inset -8px -6px 14px rgba(120,110,80,.28)}
  .moon:after{content:"";position:absolute;left:22px;top:16px;width:14px;height:14px;border-radius:50%;background:rgba(160,150,110,.22);box-shadow:24px 22px 0 -3px rgba(160,150,110,.18),-8px 30px 0 -5px rgba(160,150,110,.18)}
  .horizon{position:absolute;left:0;right:0;bottom:0;height:42%;
    background:linear-gradient(180deg,transparent,rgba(8,12,34,.65))}
  .hills{position:absolute;left:-5%;right:-5%;bottom:-2%;height:34%;
    background:#050817;border-radius:50% 50% 0 0/70% 70% 0 0;
    box-shadow:0 -2px 24px rgba(120,140,220,.08)}
  .pines{position:absolute;left:0;right:0;bottom:0;height:26%;
    background:
      conic-gradient(from 180deg at 8% 100%, transparent 0 135deg,#040611 135deg 225deg,transparent 225deg) 0 0/70px 120px repeat-x,
      conic-gradient(from 180deg at 26% 100%, transparent 0 135deg,#06091a 135deg 225deg,transparent 225deg) 0 0/90px 150px repeat-x,
      conic-gradient(from 180deg at 55% 100%, transparent 0 135deg,#030510 135deg 225deg,transparent 225deg) 0 0/110px 190px repeat-x,
      conic-gradient(from 180deg at 82% 100%, transparent 0 135deg,#05081a 135deg 225deg,transparent 225deg) 0 0/85px 140px repeat-x;}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-340px)}}
  @keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-18deg)}
    6%{opacity:1}18%{opacity:.9;transform:translate(420px,135px) rotate(-18deg)}
    20%{opacity:0;transform:translate(440px,142px) rotate(-18deg)}100%{opacity:0}}
  @keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.6}}
  .twinkle{animation:twinkle 4.5s ease-in-out infinite}
  .stars{animation:drift 240s linear infinite}
  .shooting{animation:shoot 11s ease-in 3s infinite}
  .moon{animation:sway 9s ease-in-out infinite}
  .glow{animation:pulse 7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  @media (prefers-color-scheme:light){
    body{background:#eef1fb}
    .sky{background:linear-gradient(180deg,#dbe4ff,#eef1fb 70%,#f7f2ff)}
    .stars,.twinkle,.shooting,.glow{display:none}
    .moon{background:radial-gradient(circle at 35% 32%,#fff,#f2e9c8);box-shadow:0 0 18px rgba(180,150,90,.18)}
    .hills{background:#c9d2f0}.pines{filter:opacity(.5)}
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="stars" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 340 340">
      <g fill="#fff">
        <circle cx="18" cy="40" r="1.1"/><circle cx="62" cy="88" r="0.8"/><circle cx="104" cy="24" r="1.4"/>
        <circle cx="150" cy="70" r="0.7"/><circle cx="196" cy="30" r="1"/><circle cx="240" cy="96" r="1.2"/>
        <circle cx="288" cy="52" r="0.9"/><circle cx="320" cy="110" r="1.3"/><circle cx="36" cy="140" r="0.8"/>
        <circle cx="82" cy="178" r="1.1"/><circle cx="128" cy="132" r="0.7"/><circle cx="172" cy="190" r="1.3"/>
        <circle cx="220" cy="150" r="0.9"/><circle cx="266" cy="204" r="1"/><circle cx="310" cy="166" r="1.2"/>
        <circle cx="12" cy="240" r="1"/><circle cx="58" cy="284" r="1.3"/><circle cx="110" cy="250" r="0.8"/>
        <circle cx="158" cy="300" r="1.1"/><circle cx="206" cy="262" r="0.7"/><circle cx="252" cy="318" r="1.2"/>
        <circle cx="300" cy="278" r="0.9"/><circle cx="330" cy="320" r="1"/>
      </g>
    </svg>
  </div>
  <div class="twinkle" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 600" preserveAspectRatio="none">
      <g fill="#fff">
        <circle cx="120" cy="90" r="1.8"/><circle cx="380" cy="150" r="1.6"/><circle cx="640" cy="80" r="2"/>
        <circle cx="820" cy="210" r="1.7"/><circle cx="240" cy="250" r="1.5"/><circle cx="520" cy="300" r="1.9"/>
        <circle cx="720" cy="360" r="1.6"/><circle cx="160" cy="380" r="2"/><circle cx="440" cy="420" r="1.5"/>
        <circle cx="900" cy="120" r="1.8"/><circle cx="60" cy="200" r="1.6"/><circle cx="300" cy="340" r="1.7"/>
      </g>
    </svg>
  </div>
  <div class="shooting" aria-hidden="true"></div>
  <div class="orb glow" aria-hidden="true" style="left:20%;top:60%;width:180px;height:180px;background:radial-gradient(circle,rgba(120,150,255,.18),transparent 70%)"></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>
  <div class="hills" aria-hidden="true"></div>
  <div class="pines" aria-hidden="true"></div>
</body>
</html>
