<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Imp</title>
  <link rel="icon" type="image/png" sizes="32x32" href="pkg/icons/32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="pkg/icons/16.png">
  <link rel="apple-touch-icon" href="pkg/icons/128.png">
  <link rel="stylesheet" href="pkg/tokens.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="stage" id="stage" aria-label="Imps on this page">
    <div class="doors" id="doors" aria-hidden="true"></div>
    <!-- The camera, under the Imps, which can be carried over it and are in the photo where they stand. -->
    <div class="camera" id="camera-layer" hidden>
      <video id="camera-video" playsinline muted aria-hidden="true"></video>
    </div>
    <button class="connect" id="connect" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2zM16 16h2v2h-2z"/></svg>
      <span>Connect</span>
    </button>
  </main>

  <!-- The camera's controls and the photo taken, over the Imps. -->
  <div class="camera-bar" id="camera-bar" hidden>
    <button class="camera-btn" id="camera-close" type="button" aria-label="Close the camera">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="shutter" id="shutter" type="button" aria-label="Take the photo"></button>
    <button class="camera-btn" id="camera-flip" type="button" aria-label="Switch camera">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 0 1 14.5-3M20 4v4h-4M20 15a8 8 0 0 1-14.5 3M4 20v-4h4"/></svg>
    </button>
  </div>
  <div class="camera-preview" id="camera-preview" hidden>
    <img alt="The photo">
    <div class="camera-actions">
      <button class="pill" id="camera-retake" type="button">Retake</button>
      <button class="pill" id="camera-save" type="button">Save</button>
      <button class="pill primary" id="camera-send" type="button">Send</button>
    </div>
  </div>

  <button class="corner" id="add" type="button" aria-label="Connect another device" title="Connect another device" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog class="sheet" id="sheet" aria-label="Connect a device">
    <div class="grabber" aria-hidden="true"></div>
    <div class="finder" id="finder">
      <video id="camera" playsinline muted aria-hidden="true"></video>
      <div class="finder-note" id="finder-note"></div>
    </div>
    <form class="code" id="code-form" autocomplete="off">
      <input id="code" name="code" placeholder="implink://…" spellcheck="false" aria-label="Linking code" required>
      <button type="submit" aria-label="Connect">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
    <p class="sheet-error" id="sheet-error" role="alert"></p>
  </dialog>

  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
