name: ImpPhone
options:
  bundleIdPrefix: app.imp
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  Imp:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.13.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ImpPhone:
    type: application
    platform: iOS
    sources:
      - path: Imp
      # The Mac's renderer, compiled as is: an Imp on the phone is drawn by the same code.
      - path: ../Sources/Imp/Character
        group: Shared
        includes:
          - Antics.swift
          - Extras.swift
          - Face.swift
          - Geometry.swift
          - Horn.swift
          - ImpRenderer.swift
          - Motion.swift
          - Palette.swift
          - Performance.swift
          - Puppet.swift
          - SoftLight.swift
    dependencies:
      - package: Imp
        product: ImpKit
    settings:
      base:
        PRODUCT_NAME: Imp
        PRODUCT_MODULE_NAME: ImpPhone
        PRODUCT_BUNDLE_IDENTIFIER: app.imp.ImpPhone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Imp/Info.plist
      properties:
        CFBundleDisplayName: Imp
        CFBundleName: Imp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, zh-Hans]
        NSLocalNetworkUsageDescription: Imp finds your Mac on your network, so the Imps you toss can land here.
        NSCameraUsageDescription: Imp scans the pairing code your Mac shows.
        NSBonjourServices: ["_imp-link._tcp"]
        CFBundleURLTypes:
          - CFBundleURLName: app.imp.link
            CFBundleURLSchemes: [implink]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
schemes:
  ImpPhone:
    build:
      targets:
        ImpPhone: all
    run:
      config: Debug
